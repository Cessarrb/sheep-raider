<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>Sheep Raider (PS1)</title>
<style>
  :root { color-scheme: dark; --bg:#0e1116; --fg:#e8eaed; --muted:#8b93a1; --accent:#e8a33d; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display:flex; flex-direction:column; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  main { flex:1 1 auto; min-height:0; }
  #game { width:100%; height:100%; }
  #start { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px 16px; text-align:center; }
  #start h1 { margin:0 0 4px; font-size:1.3rem; }
  #start p { margin:0; color:var(--muted); font-size:.9rem; max-width:34ch; }
  .btn { display:inline-block; min-width:240px; padding:14px 18px; border-radius:12px; border:0; font-size:1rem; font-weight:600; cursor:pointer; }
  .primary { background:var(--accent); color:#1a1205; }
  .secondary { background:#232934; color:var(--fg); }
  #file { display:none; }
  #status { color:var(--muted); font-size:.85rem; min-height:1.2em; }
</style>
</head>
<body>
<section id="start">
  <h1>Looney Tunes: Sheep Raider</h1>
  <p>PlayStation emulado en el navegador. Cargá tu copia del juego (.chd, .cue/.bin) desde el dispositivo; no se sube a ningún lado. En el celular, ponelo en horizontal.</p>
  <label class="btn primary" for="file">Cargar juego desde este dispositivo</label>
  <input id="file" type="file" accept=".chd,.cue,.bin,.zip,.7z,.pbp,.iso,application/octet-stream">
  <button class="btn secondary" id="fromServer">Jugar desde la PC (servidor)</button>
  <div id="status"></div>
</section>
<main id="main" hidden><div id="game"></div></main>

<script>
  function startEmulator(gameUrl, gameName) {
    document.getElementById('start').remove();
    document.getElementById('main').hidden = false;
    window.EJS_player = '#game';
    window.EJS_core = 'psx';
    window.EJS_gameName = 'Sheep Raider';
    window.EJS_gameUrl = gameUrl;
    window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    window.EJS_color = '#e8a33d';
    window.EJS_threads = false;
    window.EJS_startOnLoaded = true;
    const s = document.createElement('script');
    s.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
    document.body.appendChild(s);
  }
  document.getElementById('file').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    document.getElementById('status').textContent = 'Cargando ' + f.name + '…';
    startEmulator(f, f.name);
  });
  const isLocal = /^(localhost|127\.0\.0\.1|192\.168\.|10\.|172\.)/.test(location.hostname);
  if (!isLocal) document.getElementById('fromServer').hidden = true;
  document.getElementById('fromServer').addEventListener('click', () => {
    if (location.protocol === 'file:') {
      document.getElementById('status').textContent = 'Para esta opción abrí la página con iniciar.bat.';
      return;
    }
    startEmulator('game/sheep-raider.chd', 'sheep-raider.chd');
  });
</script>
</body>
</html>
